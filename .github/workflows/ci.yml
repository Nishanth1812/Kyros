# Kyros CI and Android releases — runs only on pushes to dev/main.
# No repository secrets are needed; forks and untrusted PR code run with a
# read-only token and are never given signing credentials. Signing secrets are
# available only to the main release job.
name: CI

on:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22' # README requires >= 22.13; latest 22.x patch is used.
  BUN_VERSION: '1.4.0'
  JAVA_VERSION: '21' # Gradle 9.4.1 / AGP require JDK 21.
  ANDROID_CMD_LINE_TOOLS: '15859902' # cmdline-tools 22.0
  # Versions come from node_modules/react-native/gradle/libs.versions.toml:
  # compileSdk 37, buildTools 37.0.0, ndk 27.1.12297006 (targetSdk 36).
  ANDROID_SDK_PACKAGES: >-
    platform-tools
    platforms;android-36
    platforms;android-37.0
    build-tools;37.0.0
    ndk;27.1.12297006

jobs:
  quality:
    name: Tests and type check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (npm cache)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Run tests
        run: bun test tests

      - name: Run TypeScript check
        run: npm run typecheck

  android-debug:
    name: Android debug build
    if: github.ref == 'refs/heads/dev'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (npm cache)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Set up JDK 21 (Gradle dependency and wrapper caches)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Configure Android SDK location
        run: echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"

      - name: Cache Android SDK packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/android-sdk
          key: android-sdk-${{ runner.os }}-${{ runner.arch }}-cmdline-${{ env.ANDROID_CMD_LINE_TOOLS }}-api36-api37-bt37-ndk27

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: ${{ env.ANDROID_CMD_LINE_TOOLS }}
          packages: ${{ env.ANDROID_SDK_PACKAGES }}
          log-accepted-android-sdk-licenses: false

      - name: Assemble debug APK
        working-directory: android
        # gradlew is committed without the executable bit; invoke it via bash.
        # Keep the pre-release APK compatible with the x86_64 emulator and arm64 phones.
        run: bash ./gradlew --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64 :app:assembleDebug

      - name: Upload debug APK for pre-release testing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kyros-dev-${{ github.sha }}-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  signed-apk:
    name: Build and verify signed APK
    if: github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APK_PATH: android/app/build/outputs/apk/release/app-release.apk
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set release version
        id: version
        run: |
          set -euo pipefail
          pkg_version=$(node -p "require('./package.json').version")
          app_version=$(node -p "require('./app.json').expo.version")
          app_version_code=$(node -p "require('./app.json').expo.android.versionCode")
          gradle_version=$(sed -n 's/^[[:space:]]*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle | head -n 1)
          version_code=$(sed -n 's/^[[:space:]]*versionCode \([0-9][0-9]*\).*/\1/p' android/app/build.gradle | head -n 1)
          if ! printf '%s' "$app_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || \
             [ "$pkg_version" != "$app_version" ] || [ "$gradle_version" != "$app_version" ]; then
            echo "::error::Base versions in package.json, app.json and build.gradle must match and use X.Y.Z."
            exit 1
          fi
          if [ -z "$version_code" ] || [ "$version_code" -lt 1 ]; then
            echo "::error::versionCode must be a positive integer."
            exit 1
          fi
          if [ "$app_version_code" != "$version_code" ]; then
            echo "::error::app.json versionCode does not match android/app/build.gradle."
            exit 1
          fi
          git fetch origin --tags --force
          semver_tag_re='^v[0-9]+\.[0-9]+\.[0-9]+$'
          current_tag="$(git tag --points-at "$GITHUB_SHA" \
            | grep -E "$semver_tag_re" | sort -V | tail -n 1 || true)"
          latest_tag="$(git tag --list 'v[0-9]*' \
            | grep -E "$semver_tag_re" | sort -V | tail -n 1 || true)"

          if [ -n "$current_tag" ]; then
            # A rerun of a commit already tagged reuses its original version.
            release_version="${current_tag#v}"
            release_code="$(git for-each-ref --format='%(contents)' "refs/tags/$current_tag" \
              | sed -n 's/^versionCode: //p' | head -n 1)"
            if ! [[ "$release_code" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Release tag $current_tag has no valid versionCode annotation."
              exit 1
            fi
          else
            IFS=. read -r major minor patch <<< "$app_version"
            release_patch=$((10#$patch + 1))
            if [ -n "$latest_tag" ]; then
              latest_version="${latest_tag#v}"
              IFS=. read -r latest_major latest_minor latest_patch <<< "$latest_version"
              if [ "$major.$minor" = "$latest_major.$latest_minor" ]; then
                release_patch=$((10#$latest_patch + 1))
              elif [ "$(printf '%s\n' "$app_version" "$latest_version" | sort -V | tail -n 1)" != "$app_version" ]; then
                echo "::error::Source version $app_version is behind the latest release tag $latest_tag."
                exit 1
              fi
            fi
            release_version="$major.$minor.$release_patch"
            release_code=$((version_code + 1))
            if [ -n "$latest_tag" ]; then
              latest_code="$(git for-each-ref --format='%(contents)' "refs/tags/$latest_tag" \
                | sed -n 's/^versionCode: //p' | head -n 1)"
              if ! [[ "$latest_code" =~ ^[1-9][0-9]*$ ]]; then
                echo "::error::Latest release tag $latest_tag has no valid versionCode annotation."
                exit 1
              fi
              if [ "$latest_code" -ge "$release_code" ]; then
                release_code=$((latest_code + 1))
              fi
            fi
          fi
          if [ "$release_code" -gt 2100000000 ]; then
            echo "::error::Android versionCode exceeds the supported limit."
            exit 1
          fi
          sed -i -E "s/^([[:space:]]*versionName )\"[^\"]*\"/\1\"$release_version\"/; s/^([[:space:]]*versionCode )[0-9]+/\1$release_code/" android/app/build.gradle
          RELEASE_VERSION="$release_version" RELEASE_CODE="$release_code" node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.version = process.env.RELEASE_VERSION;
            app.expo.android.versionCode = Number(process.env.RELEASE_CODE);
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
          '
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "version_code=$release_code" >> "$GITHUB_OUTPUT"
          echo "Release version: $release_version (versionCode $release_code)"

      - name: Set up Node.js (npm cache)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Set up JDK 21 (Gradle dependency and wrapper caches)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Configure Android SDK and keystore paths
        run: |
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/kyros-release.jks" >> "$GITHUB_ENV"

      - name: Cache Android SDK packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/android-sdk
          key: android-sdk-${{ runner.os }}-${{ runner.arch }}-cmdline-${{ env.ANDROID_CMD_LINE_TOOLS }}-api36-api37-bt37-ndk27

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: ${{ env.ANDROID_CMD_LINE_TOOLS }}
          packages: ${{ env.ANDROID_SDK_PACKAGES }}
          log-accepted-android-sdk-licenses: false

      # Fail fast, and never echo a secret value. Only variable names are logged.
      - name: Validate signing secrets are present
        env:
          KYROS_KEYSTORE_BASE64: ${{ secrets.KYROS_RELEASE_KEYSTORE_BASE64 }}
          KYROS_RELEASE_STORE_PASSWORD: ${{ secrets.KYROS_RELEASE_STORE_PASSWORD }}
          KYROS_RELEASE_KEY_ALIAS: ${{ secrets.KYROS_RELEASE_KEY_ALIAS }}
          KYROS_RELEASE_KEY_PASSWORD: ${{ secrets.KYROS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KYROS_KEYSTORE_BASE64 KYROS_RELEASE_STORE_PASSWORD KYROS_RELEASE_KEY_ALIAS KYROS_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required repository secret: $name."
              exit 1
            fi
          done

      - name: Decode release keystore outside the workspace
        env:
          KYROS_KEYSTORE_BASE64: ${{ secrets.KYROS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          if ! printf '%s' "$KYROS_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"; then
            echo "::error::KYROS_RELEASE_KEYSTORE_BASE64 is not valid base64."
            rm -f "$KEYSTORE_FILE"
            exit 1
          fi
          test -s "$KEYSTORE_FILE"

      - name: Assemble signed release APK
        env:
          KYROS_RELEASE_STORE_FILE: ${{ runner.temp }}/kyros-release.jks
          KYROS_RELEASE_STORE_PASSWORD: ${{ secrets.KYROS_RELEASE_STORE_PASSWORD }}
          KYROS_RELEASE_KEY_ALIAS: ${{ secrets.KYROS_RELEASE_KEY_ALIAS }}
          KYROS_RELEASE_KEY_PASSWORD: ${{ secrets.KYROS_RELEASE_KEY_PASSWORD }}
        working-directory: android
        run: bash ./gradlew --no-daemon :app:assembleRelease

      - name: Verify signed APK
        env:
          KT_STORE_PASSWORD: ${{ secrets.KYROS_RELEASE_STORE_PASSWORD }}
          KT_KEY_ALIAS: ${{ secrets.KYROS_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Signed APK not found at $APK_PATH."
            exit 1
          fi
          build_tools="$(printf '%s\n' "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n 1)"
          if [ ! -x "$build_tools/zipalign" ] || [ ! -x "$build_tools/apksigner" ]; then
            echo "::error::zipalign/apksigner not found in $build_tools."
            exit 1
          fi
          "$build_tools/zipalign" -c -v 4 "$APK_PATH" >/dev/null
          cert_output="$("$build_tools/apksigner" verify --verbose --print-certs "$APK_PATH")"
          printf '%s\n' "$cert_output"
          expected_output="$(keytool -exportcert -rfc -keystore "$KEYSTORE_FILE" \
            -alias "$KT_KEY_ALIAS" -storepass:env KT_STORE_PASSWORD 2>/dev/null \
            | openssl x509 -noout -fingerprint -sha256)"
          expected="$(printf '%s\n' "$expected_output" \
            | sed -n 's/^[^=]*=//p' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          actual="$(printf '%s\n' "$cert_output" \
            | awk -F': ' '/certificate SHA-256 digest/ {print toupper($NF); exit}' \
            | tr -d ':')"
          if [ -z "$expected" ] || [ -z "$actual" ]; then
            echo "::error::Could not read the public certificate fingerprint from the keystore or APK."
            exit 1
          fi
          echo "Configured keystore certificate SHA-256: $expected"
          echo "APK signer certificate SHA-256: $actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::APK signer certificate does not match the configured release keystore."
            exit 1
          fi

      - name: Record release version tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if [ "$(git rev-list -n 1 "$tag")" != "$GITHUB_SHA" ]; then
              echo "::error::Release tag $tag already points to another commit."
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$GITHUB_SHA" \
              -m "Kyros release $RELEASE_VERSION" \
              -m "versionCode: $RELEASE_CODE"
            git push origin "refs/tags/$tag"
          fi

      - name: Upload verified signed APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kyros-${{ steps.version.outputs.version }}-signed-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$KEYSTORE_FILE"
